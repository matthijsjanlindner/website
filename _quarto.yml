project:
  type: website
  output-dir: _site
  # Only .qmd files are pages. Without this, Quarto treats every .md in the
  # project as an input and renders it into the site — README.md would become
  # a public page at /README.html and show up in search and the sitemap.
  render:
    - "*.qmd"
  # Files copied into the built site verbatim. Add CNAME here if you set up a
  # custom domain (see README), otherwise the domain breaks on every deploy.
  # resources:
  #   - CNAME

website:
  title: "Your Name"
  site-url: "https://github.com/matthijsjanlindner/website"
  description: "Academic homepage of Thijs Lindner — research, teaching, and outreach."
  # favicon: images/favicon.png
  #
  # Worth knowing: the only size that matters for a favicon is 16px, in a
  # browser tab. Test it there before anywhere else. A plain dark letter on a
  # transparent ground disappears on a dark tab bar; a white ground dissolves
  # into a light one. A solid coloured block with a light letter reads on both.

  # Quarto's search ships ~145 KB of JavaScript plus an index. That is worth it
  # for a documentation site; for a five-page CV site where every page is one
  # navbar click away, it usually is not. Set to false to drop it.
  search: true

  back-to-top-navigation: true

  # Without these, a link shared on Bluesky, X, LinkedIn or Slack renders as a
  # bare URL with no title, summary or image. `image:` is the card thumbnail.
  open-graph: true
  twitter-card: true
  image: images/profile.svg

  navbar:
    # Set a string here for brand text at the far left. `false` avoids a brand
    # link that goes to the same place as Home.
    title: false
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: outreach.qmd
        text: Outreach
      - href: contacts.qmd
        text: Contacts

  page-footer:
    left: "© 2026 Your Name"
    right: "Made with [Quarto](https://quarto.org)"

format:
  html:
    # cosmo and darkly are stock Bootswatch themes — this is Quarto's standard
    # look, unmodified. The light/dark toggle in the navbar comes free from
    # listing both.
    #
    # styles.scss is listed in BOTH so any customisation applies to both modes.
    # Putting it through the theme pipeline (rather than a plain `css:` link)
    # makes Quarto compile it to a content-hashed filename, so an edit always
    # produces a new URL and can never be served from a stale browser cache.
    # A plain `css: styles.css` causes exactly that bug.
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    toc-depth: 2
    anchor-sections: true
    smooth-scroll: true

editor: visual
